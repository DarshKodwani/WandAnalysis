name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: wand
          environment-file: environment.yml
          auto-activate-base: false

      - name: Run pytest
        shell: bash -l {0}
        run: |
          pytest -q
